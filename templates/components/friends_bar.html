<div class="friends-menu-container" style="position: relative; display: inline-block;">
    <!-- Bouton Ami -->
    <button onclick="toggleFriendsMenu()" style="background-color: #1e1e1e; color: #4caf50; border: 1px solid #444; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.95rem;">
        🤝 Amis <span id="badge-demandes" style="display:none; background: #ff4757; color: white; padding: 2px 6px; border-radius: 50%; font-size: 0.75rem;">!</span> ▾
    </button>

    <!-- Menu déroulant -->
    <div id="friends-dropdown" style="display: none; position: absolute; right: 0; top: 120%; background: #1e1e1e; border: 1px solid #444; border-radius: 8px; padding: 15px; width: 300px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); z-index: 1000;">
        
        <!-- Envoyer une demande -->
        <div style="margin-bottom: 15px;">
            <input type="text" id="friend-pseudo" placeholder="Pseudo de l'ami..." style="width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; margin-bottom: 8px; box-sizing: border-box;">
            <button onclick="ajouterAmi()" style="width: 100%; background: #4caf50; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 4px; cursor: pointer;">Envoyer demande</button>
        </div>

        <!-- Demandes d'amis en attente -->
        <div id="section-demandes" style="display: none; margin-bottom: 15px;">
            <hr style="border: 0; border-top: 1px solid #444; margin: 10px 0;">
            <p style="color: #ffcc00; font-weight: bold; margin-bottom: 8px; margin-top: 0; font-size: 0.9rem;">📩 Demandes reçues :</p>
            <ul id="requests-list" style="list-style: none; padding: 0; margin: 0; color: #ccc;"></ul>
        </div>

        <hr style="border: 0; border-top: 1px solid #444; margin: 10px 0;">

        <!-- Liste des amis confirmés -->
        <div>
            <p style="color: #ffcc00; font-weight: bold; margin-bottom: 10px; margin-top: 0; font-size: 0.9rem;">👥 Mes Amis :</p>
            <ul id="friends-list" style="list-style: none; padding: 0; margin: 0; color: #ccc; max-height: 180px; overflow-y: auto;">
                <li style="padding: 5px 0; color: #888;">Chargement...</li>
            </ul>
        </div>
    </div>
</div>

<script>
function toggleFriendsMenu() {
    const dropdown = document.getElementById('friends-dropdown');
    const isHidden = dropdown.style.display === 'none' || dropdown.style.display === '';
    dropdown.style.display = isHidden ? 'block' : 'none';
    
    if (isHidden) {
        chargerDemandes();
        chargerAmis();
    }
}

function chargerDemandes() {
    fetch('/api/friends/requests')
        .then(r => r.json())
        .then(demandes => {
            const container = document.getElementById('section-demandes');
            const list = document.getElementById('requests-list');
            const badge = document.getElementById('badge-demandes');
            list.innerHTML = '';

            if (demandes && demandes.length > 0) {
                container.style.display = 'block';
                if(badge) badge.style.display = 'inline-block';
                
                demandes.forEach(pseudo => {
                    list.innerHTML += `
                        <li style="padding: 6px 0; display: flex; justify-content: space-between; align-items: center;">
                            <strong style="color: #fff; font-size: 0.9rem;">${pseudo}</strong>
                            <div>
                                <button onclick="repondreDemande('${pseudo}', 'accept')" style="background: #4caf50; color: white; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-right: 4px;">✓</button>
                                <button onclick="repondreDemande('${pseudo}', 'decline')" style="background: #ff4757; color: white; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">✕</button>
                            </div>
                        </li>
                    `;
                });
            } else {
                container.style.display = 'none';
                if(badge) badge.style.display = 'none';
            }
        });
}

function repondreDemande(pseudo, action) {
    const url = action === 'accept' ? '/api/friends/accept' : '/api/friends/decline';
    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ pseudo: pseudo })
    })
    .then(r => r.json())
    .then(res => {
        alert(res.message);
        chargerDemandes();
        chargerAmis();
    });
}

function chargerAmis() {
    const list = document.getElementById('friends-list');
    list.innerHTML = '<li style="padding: 5px 0; color: #888;">Chargement...</li>';

    fetch('/api/friends/list')
        .then(r => r.json())
        .then(amis => {
            list.innerHTML = '';
            if (!amis || amis.length === 0) {
                list.innerHTML = '<li style="padding: 5px 0; color: #888; font-size: 0.85rem;">Aucun ami confirmé.</li>';
                return;
            }
            amis.forEach(ami => {
                list.innerHTML += `
                    <li style="padding: 8px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong style="color: #fff; font-size: 0.9rem;">${ami.pseudo}</strong><br>
                            <small style="color: #4caf50;">💎 ${ami.valeur_collection} €</small>
                        </div>
                        <a href="/ami/${ami.pseudo}/collection" style="background: #2196f3; color: white; text-decoration: none; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold;">Voir</a>
                    </li>
                `;
            });
        });
}

function ajouterAmi() {
    const input = document.getElementById('friend-pseudo');
    const pseudo = input.value.trim();
    if (!pseudo) return;

    fetch('/api/friends/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ pseudo: pseudo })
    })
    .then(r => r.json())
    .then(res => {
        alert(res.message);
        if (res.status === 'success') {
            input.value = '';
        }
    });
}

window.addEventListener('click', function(e) {
    const container = document.querySelector('.friends-menu-container');
    if (container && !container.contains(e.target)) {
        const dropdown = document.getElementById('friends-dropdown');
        if (dropdown) dropdown.style.display = 'none';
    }
});
</script>
